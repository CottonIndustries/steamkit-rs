[workspace]
resolver = "2"
members = [
    "crates/steamkit-protos",
    "crates/steamkit",
    "crates/steamkit-tools",
    "crates/steamkit-samples",
    "crates/steamkit-tests",
    "crates/steamkit-nethook",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "LGPL-2.1-only"
repository = "https://github.com/CottonIndustries/steamkit-rs"

[workspace.dependencies]
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
hex = "0.4"
base64 = "0.23"
rand = "0.10"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
